name: heloc_mini
description: Minimal HELOC config for testing

target:
  column: RiskPerformance
  positive_label: 0
  negative_label: 1
  positive_meaning: "good borrower"
  negative_meaning: "bad borrower"

decisions:
  approve: APPROVE
  deny: DENY
  approve_maps_to: positive
  deny_maps_to: negative

special_values:
  values: [-7, -8, -9]
  meanings:
    -7: "condition not met"
    -8: "no usable data"
    -9: "no bureau record"
  treatment: missing

features:
  - name: ExternalRiskEstimate
    description: "Credit risk score"
    type: integer
    range: "33-94"
    direction: higher_better
  - name: NetFractionRevolvingBurden
    description: "Revolving utilization"
    type: integer
    range: "0-232"
    direction: lower_better
  - name: NumTrades60Ever2DerogPubRec
    description: "60+ day delinquencies"
    type: integer
    range: "0-19"
    direction: lower_better

summary_features:
  - ExternalRiskEstimate
  - NetFractionRevolvingBurden
  - NumTrades60Ever2DerogPubRec

regulatory_context: "Test regulatory context."
data_observations: "Test observations."
decision_framework: "Test framework."
product_context: "Test product."

evaluation:
  prohibited_features: []
  require_reason_codes: true
  max_crash_rate: 0.1
  weights:
    accuracy: 0.4
    simplicity: 0.2
    robustness: 0.2
    coverage: 0.2

defaults:
  sample_size: 10
  n_clusters: 3
  holdout_size: 20
  batch_size: 5
  n_candidates: 2
  n_generations: 2
  top_k: 1
