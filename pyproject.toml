[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solon"
version = "0.1.0"
description = "Distillation of LLM reasoning into deterministic code."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ramakrishna Kompella", email = "rk@goedelmachines.com"}]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.65",
    "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.30"]
analysis = ["umap-learn>=0.5", "hdbscan>=0.8", "matplotlib>=3.7"]
baselines = ["xgboost>=2.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["solon[anthropic,openai,analysis,baselines,dev]"]

[project.scripts]
solon = "solon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
