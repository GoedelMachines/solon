regulatory_context: |
  Fair Credit Reporting Act (FCRA):
  - Lenders must provide specific adverse action reason codes when denying credit (15 USC 1681m).
  - Reason codes must be specific and actionable.
  - Standard FCRA adverse action reason codes include: "Amount owed on accounts is too high",
    "Delinquent past or present on accounts", "Too few accounts currently paid as agreed",
    "Length of time accounts have been established", "Too many recent inquiries",
    "Proportion of balances to credit limits too high", "Too many accounts recently opened",
    "Number of accounts with delinquency", "Serious delinquency or public record".

  Equal Credit Opportunity Act (ECOA / Regulation B):
  - Cannot discriminate based on race, color, religion, national origin, sex, marital status, age,
    receipt of public assistance, or exercise of rights under Consumer Credit Protection Act.
  - This dataset contains no demographic features, so ECOA compliance is inherent.

  Truth in Lending Act (TILA):
  - Requires clear disclosure of loan terms, APR, and total cost of credit.
  - Relevant for unsecured consumer lending products.

data_observations: |
  The following are empirical observations from this borrower population. They do not prescribe
  a decision strategy — use your own judgment about how to weigh them.

  - The default rate is approximately 20%. This population skews toward borrowers who may not
    qualify for traditional bank loans.

  - FICO scores are narrow-range (660-850) because Lending Club has a 660 minimum floor.
    Most borrowers cluster between 670-720. Small differences in FICO within this range
    may still be meaningful.

  - 58% of loans are for debt consolidation and 24% for credit card refinancing. The
    population is relatively homogeneous in stated purpose.

  - emp_title (job title) is extremely noisy free text with 411k unique values and many
    typos, but shows real occupational signal: professional roles (attorney 11.6%, software
    engineer 11.4% default rate) vs labor/service roles (truck driver 29.5%, machine operator
    26.3%, server 26.6%).

  - Several "months since" features have high missing rates (48-82%). For these features,
    missing means "no event on record" — this is typically a POSITIVE signal. For example,
    mths_since_last_delinq being missing means the borrower has never been delinquent.

  - 60-month loans default at roughly double the rate of 36-month loans.

decision_framework: |
  For each application, assess the following dimensions and use your own judgment to weigh them:

  1. Creditworthiness — FICO score, delinquency history, public records, percent never delinquent
  2. Capacity — annual income, DTI ratio, existing debt burden relative to income
  3. Leverage — revolving utilization, bankcard utilization, total balances relative to limits
  4. Recent behavior — inquiries, new accounts opened, recency of delinquency
  5. Stability — employment length, home ownership, credit history depth
  6. Loan characteristics — amount relative to income, term choice (60-month is riskier)
  7. Occupational signal — job title patterns if the program chooses to use emp_title

  Consider how features interact. A high DTI with strong FICO and long employment history
  is different from high DTI with thin credit and recent delinquency. A single concerning
  signal may not warrant denial if other dimensions are strong. Multiple moderate concerns
  may compound into a denial.

product_context: |
  This is an unsecured personal loan (no collateral) issued through a peer-to-peer lending
  platform. Loan amounts range from $1,000 to $35,000 with 36 or 60 month terms. Unlike
  HELOC products, there is no home equity securing the loan, so the lender bears full loss
  on default. Consider what that means for how you weigh current debt burden and repayment
  capacity.

evaluation:
  prohibited_features: []
  require_reason_codes: true
  max_crash_rate: 0.1
  weights:
    accuracy: 0.4
    simplicity: 0.2
    robustness: 0.2
    coverage: 0.2
  simplicity_thresholds:
    ideal_max: 15
    good_max: 30
    acceptable_max: 50

synthesizer:
  function_name: underwrite
  return_fields:
    - decision
    - reason_codes
    - score

defaults:
  sample_size: 100
  n_clusters: 20
  holdout_size: 500
  batch_size: 10
  n_candidates: 5
  n_generations: 10
  top_k: 3
