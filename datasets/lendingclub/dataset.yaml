name: lendingclub
description: >
  Lending Club peer-to-peer lending dataset. 2.26M personal loans issued 2007-2018,
  ~1.35M with resolved outcomes (Fully Paid or Charged Off). 58 origination features
  including FICO scores, credit bureau data, employment, and free-text job titles.
  Default rate ~20%.

target:
  column: loan_status
  positive_label: "Fully Paid"
  negative_label: "Charged Off"
  positive_meaning: "borrower repaid the loan in full"
  negative_meaning: "borrower defaulted (charged off)"

decisions:
  approve: APPROVE
  deny: DENY
  approve_maps_to: positive
  deny_maps_to: negative

special_values:
  values: []
  meanings: {}
  treatment: missing

features:
  - name: loan_amnt
    description: "Requested loan amount in dollars."
    type: numeric
    range: "1000-35000"
    direction: neutral
    distribution: "Median: 12,425. P5: 3,500, P25: 8,000, P75: 20,000, P95: 32,151."
    missing_pct: 0.0

  - name: term
    description: "Loan term. Values: '36 months' or '60 months'."
    type: categorical
    range: "36 months, 60 months"
    direction: neutral
    distribution: "76% are 36-month, 24% are 60-month."
    missing_pct: 0.0

  - name: emp_title
    description: "Free-text job title entered by borrower. Extremely noisy (411k unique values, many typos). Contains occupational signal: professional roles (attorney 11.6%, software engineer 11.4% default) vs labor roles (truck driver 29.5%, machine operator 26.3%)."
    type: string
    range: "free text"
    direction: neutral
    distribution: "Top titles: teacher (48k), manager (46k), owner (34k), registered nurse (23k), driver (22k). 5.9% missing."
    missing_pct: 5.9

  - name: emp_length
    description: "Employment length. Categories: '< 1 year', '1 year', '2 years', ..., '9 years', '10+ years'."
    type: categorical
    range: "< 1 year to 10+ years"
    direction: higher_better
    distribution: "33% are '10+ years'. 8.3% are '< 1 year'."
    missing_pct: 5.9

  - name: home_ownership
    description: "Home ownership status of borrower."
    type: categorical
    range: "MORTGAGE, RENT, OWN"
    direction: neutral
    distribution: "MORTGAGE 49%, RENT 40%, OWN 11%."
