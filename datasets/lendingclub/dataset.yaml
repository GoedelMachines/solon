  - name: annual_inc
    description: "Self-reported annual income in dollars."
    type: numeric
    range: "0-9500000"
    direction: higher_better
    distribution: "Median: 65,000. P5: 28,000, P25: 45,000, P75: 90,500, P95: 156,000."
    missing_pct: 0.0

  - name: verification_status
